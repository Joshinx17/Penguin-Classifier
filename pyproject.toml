[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "penguin-classifier"
version = "0.2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "tensorflow-cpu>=2.19,<2.21; platform_system != 'Darwin'",
  "tensorflow>=2.19,<2.21; platform_system == 'Darwin'",
  "streamlit>=1.45,<2",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["penguin_classifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds a real TensorFlow model"]

[tool.ruff]
line-length = 100
target-version = "py311"
